[package]
name = "conduit-runtime"
version = "0.1.0"
edition = "2021"
description = "SessionManager, session state machine, backoff, logs, and events for Rusty Conduit SSH GUI."
license = "BSD-3-Clause"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-ssh = { path = "../conduit-ssh" }
conduit-vault = { path = "../conduit-vault" }
rusty-conduit-ssh = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
p12-keystore = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
russh = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
