[package]
name = "conduit-runtime"
version = "0.1.0"
edition = "2021"
description = "SessionManager, session state machine, backoff, logs, and events for Rusty Conduit GUI."
license = "BSD-3-Clause"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-openssh = { path = "../conduit-openssh" }
conduit-ssh = { path = "../conduit-ssh" }
conduit-vault = { path = "../conduit-vault" }
rusty-conduit-ssh = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# OS wake listeners (see src/wake.rs). All pure Rust or thin OS bindings.
[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSNotification",
    "NSOperation",
    "NSString",
] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
russh = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
