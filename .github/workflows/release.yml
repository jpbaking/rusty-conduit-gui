name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, but do not create a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Cargo.toml pulls rusty-conduit-engine from its git tag (v0.6.0); fetching it with the
  # git CLI is more reliable on CI runners than Cargo's built-in git client.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  TAURI_CLI_VERSION: 2.12.6
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  # The tag carries the full release version (v0.2.0-beta.6); the version files hold X.Y.Z,
  # because MSI and RPM versions cannot carry a pre-release label.
  version:
    name: Release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the release version from the tag
        id: resolve
        run: |
          python3 scripts/release-version.py --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.name }})
    needs: [verify, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            stage_args: --target x86_64-unknown-linux-gnu
            platform: linux
            artifacts: deb/*.deb rpm/*.rpm appimage/*.AppImage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            stage_args: --target aarch64-unknown-linux-gnu
            platform: linux
            artifacts: deb/*.deb rpm/*.rpm appimage/*.AppImage
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            stage_args: --universal-macos
            platform: macos
            artifacts: dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            stage_args: --target x86_64-pc-windows-msvc
            platform: windows
            artifacts: nsis/*.exe msi/*.msi
            sign_windows: true
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            stage_args: --target aarch64-pc-windows-msvc
            platform: windows
            artifacts: nsis/*.exe msi/*.msi
            sign_windows: true
    defaults:
      run:
        shell: bash
        working-directory: rusty-conduit-gui
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE_DIR: target/${{ matrix.target }}/release/bundle
      # Read by the frontend build (About page) and the app binary (`--version`).
      CONDUIT_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      # The secrets context is not available in step `if` conditions.
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - name: Keep line endings unchanged on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: rusty-conduit-gui
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rusty-conduit-gui/src-tauri/ui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libgtk-3-dev rpm

      - name: Install Rust
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add $RUST_TARGETS

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Build frontend
        working-directory: rusty-conduit-gui/src-tauri/ui
        run: |
          npm ci
          npm run build

      - name: Stage conduit-worker
        env:
          STAGE_ARGS: ${{ matrix.stage_args }}
        run: python scripts/stage-worker.py $STAGE_ARGS

      - name: Import Windows signing certificate
        id: windows_signing
        if: matrix.sign_windows && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey | Select-Object -First 1
          } finally {
            Remove-Item $pfx -Force
          }
          if (-not $cert) { throw 'WINDOWS_CERTIFICATE has no certificate with a private key' }
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 4 -Compress
          $path = Join-Path $env:RUNNER_TEMP 'windows-signing.conf.json'
          Set-Content -Path $path -Value $config -Encoding utf8NoBOM
          "config=$path" >> $env:GITHUB_OUTPUT

      - name: Build bundles (Linux, Windows)
        if: runner.os != 'macOS'
        env:
          SIGNING_CONFIG: ${{ steps.windows_signing.outputs.config }}
        run: |
          extra=()
          if [ -n "$SIGNING_CONFIG" ]; then
            extra=(--config "$SIGNING_CONFIG")
          else
            if [ "$RUNNER_OS" = "Windows" ]; then echo "::warning::Building unsigned Windows installers."; fi
          fi
          cargo tauri build --config src-tauri/tauri.bundle.conf.json --target "$TARGET" "${extra[@]}"

      - name: Build bundles (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri treats a variable that is set but empty as configured, so unset unused ones.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY="-"
            echo "::warning::APPLE_CERTIFICATE is not set. Building an ad-hoc signed app."
          else
            if [ -z "$APPLE_SIGNING_IDENTITY" ]; then unset APPLE_SIGNING_IDENTITY; fi
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              echo "::warning::Apple notarization credentials are incomplete. Skipping notarization."
            fi
          fi
          cargo tauri build --config src-tauri/tauri.bundle.conf.json --target "$TARGET"

      - name: Smoke test bundles
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/smoke-test-bundle.py --bundle-dir "$BUNDLE_DIR" --platform "$PLATFORM"

      - name: Collect release files
        env:
          ARTIFACTS: ${{ matrix.artifacts }}
        run: |
          mkdir -p release-files
          out="$PWD/release-files"
          cd "$BUNDLE_DIR"
          # The product name "Rusty Conduit GUI" names the installers. Release assets get a
          # name without spaces or parentheses, which GitHub would otherwise rewrite, and the
          # full release version in place of the X.Y.Z Tauri wrote (0.2.0 -> 0.2.0-beta.6).
          base="${CONDUIT_RELEASE_VERSION%%-*}"
          asset_name() {
            local name
            name="$(basename "$1" | tr ' ' '-' | tr -d '()')"
            case "$name" in
              *"$base"*) printf '%s\n' "${name%%"$base"*}$CONDUIT_RELEASE_VERSION${name#*"$base"}" ;;
              *) echo "::error::$name does not contain version $base" >&2; return 1 ;;
            esac
          }
          for file in $ARTIFACTS; do
            if [ ! -f "$file" ]; then echo "::error::No file matches $file"; exit 1; fi
            name="$(asset_name "$file")"
            cp "$file" "$out/$name"
          done
          # An artifact upload drops symlinks and file modes, so the .app must travel as a tar.
          if [ "$RUNNER_OS" = "macOS" ]; then
            apps=(macos/*.app)
            if [ ${#apps[@]} -ne 1 ] || [ ! -d "${apps[0]}" ]; then
              echo "::error::Expected one .app in macos/, found: ${apps[*]}"; exit 1
            fi
            for dmg in dmg/*.dmg; do
              name="$(asset_name "$dmg")"
              tar -czf "$out/${name%.dmg}.app.tar.gz" -C macos "$(basename "${apps[0]}")"
            done
          fi

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: rusty-conduit-gui/release-files/*
          if-no-files-found: error

  release:
    name: Release
    needs: [package, version]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # A tag with a label (v0.2.0-beta.6) is published as a GitHub pre-release.
          extra=()
          if [ "$PRERELEASE" = "true" ]; then extra=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes "${extra[@]}" -- *
